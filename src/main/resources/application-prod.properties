# Base de donnees PROD (Supabase) - fournies par les variables d'env Render, aucune valeur par defaut
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# IMPORTANT : update = ne modifie que ce qui a change (ne supprime RIEN)
spring.jpa.hibernate.ddl-auto=update
# PAS de SQL dans les logs en prod (performance)
spring.jpa.show-sql=false
logging.level.com.fishcam=INFO
logging.level.org.hibernate.SQL=WARN
# Cle JWT PRODUCTION (DIFFERENTE de dev !) - fournie par Render, aucune valeur par defaut
jwt.secret=${JWT_SECRET}
# Pas de logs fichier : disque Render ephemere, on garde la console (capturee par Render)
# Rapport journalier ? TOUS LES JOURS � 19H
rapport.cron.expression=0 0 19 * * *
rapport.rattrapage.enabled=true
# Stockage avatars PROD
fishcam.upload.avatar-dir=/opt/fishcam/data/avatars